<!DOCTYPE html><html><head><meta charset="utf-8">
<style>@font-face{font-family:'Virgil';src:url(https://excalidraw.com/Virgil.woff2) format('woff2');font-display:block;}
html,body{margin:0;padding:0;} svg text{font-family:'Virgil',sans-serif;}</style></head><body>
<svg id="scene" xmlns="http://www.w3.org/2000/svg" width="1000" height="780" viewBox="0 0 1000 780"></svg>
<script type="module">
import rough from "https://esm.sh/roughjs@4.6.6";
const svg=document.getElementById("scene"),NS="http://www.w3.org/2000/svg";
const LIGHT="#f4f2ec",ORANGE="#F54D26",FAINT="#a5a29a",DIM="#6a6760";
const bg=document.createElementNS(NS,"rect");bg.setAttribute("width",1000);bg.setAttribute("height",780);bg.setAttribute("fill","#0c0c10");svg.appendChild(bg);
const rc=rough.svg(svg);
function txt(x,y,s,size,c,a){const t=document.createElementNS(NS,"text");t.setAttribute("x",x);t.setAttribute("y",y);t.setAttribute("font-size",Math.max(size,20));t.setAttribute("fill",c);t.setAttribute("text-anchor",a||"middle");t.setAttribute("font-family","Virgil, sans-serif");t.textContent=s;svg.appendChild(t);}
function circ(x,y,d,c,sw){svg.appendChild(rc.circle(x,y,d,{stroke:c,strokeWidth:sw||3,roughness:1.3}));}
function ln(x1,y1,x2,y2,c,sw){svg.appendChild(rc.line(x1,y1,x2,y2,{stroke:c,strokeWidth:sw||3,roughness:1.3}));}
function rct(x,y,w,h,c,sw){svg.appendChild(rc.rectangle(x,y,w,h,{stroke:c,strokeWidth:sw||2.6,roughness:1.4}));}
function house(cx,cy,c){rct(cx-26,cy-8,52,42,c,2.6); ln(cx-34,cy-8,cx,cy-40,c); ln(cx+34,cy-8,cx,cy-40,c);}
function gear(cx,cy,r,c){circ(cx,cy,r*2,c,2.4);circ(cx,cy,r*0.7,c,2);for(let i=0;i<8;i++){const a=i*Math.PI/4;ln(cx+Math.cos(a)*r,cy+Math.sin(a)*r,cx+Math.cos(a)*(r+13),cy+Math.sin(a)*(r+13),c,3);}}
txt(500,72,"You're buying the outcome, not the machinery",29,LIGHT);
txt(500,126,"what you actually want",20,FAINT);
// three outcome cards
const cards=[[200,"Money","leads stop slipping"],[500,"Stability","holds when you're out"],[800,"Peace","you finally sleep"]];
cards.forEach(c=>{rct(c[0]-135,150,270,150,ORANGE,2.8);});
txt(200,232,"$",50,ORANGE); txt(200,282,"Money",26,ORANGE);
house(500,222,ORANGE); txt(500,282,"Stability",26,ORANGE);
txt(800,238,"Zzz",40,ORANGE); txt(800,282,"Peace",26,ORANGE);
cards.forEach(c=>txt(c[0],332,c[2],20,FAINT));
// divider
svg.appendChild(rc.line(120,400,880,400,{stroke:DIM,strokeWidth:2,roughness:1.1}));
txt(500,446,"underneath, just the machinery",20,FAINT);
gear(410,540,44,DIM); gear(560,560,54,DIM);
txt(500,690,"If you can't see which outcome it moves, you're buying the machinery.",20,FAINT);
window.__ready=true;
</script></body></html>
