<!DOCTYPE html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Virgil';src:url(https://excalidraw.com/Virgil.woff2) format('woff2');font-display:block;}
html,body{margin:0;padding:0;} svg text{font-family:'Virgil',sans-serif;}
</style></head><body>
<svg id="scene" xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620"></svg>
<script type="module">
import rough from "https://esm.sh/roughjs@4.6.6";
const svg=document.getElementById("scene"), NS="http://www.w3.org/2000/svg";
const LIGHT="#f4f2ec", ORANGE="#F54D26", FAINT="#a5a29a", DIM="#77746e";
const W=+svg.getAttribute("width"), H=+svg.getAttribute("height");
const bg=document.createElementNS(NS,"rect");bg.setAttribute("width",W);bg.setAttribute("height",H);bg.setAttribute("fill","#0c0c10");svg.appendChild(bg);
const rc=rough.svg(svg);
function txt(x,y,s,size,color,anchor){const t=document.createElementNS(NS,"text");t.setAttribute("x",x);t.setAttribute("y",y);t.setAttribute("font-size",size);t.setAttribute("fill",color);t.setAttribute("text-anchor",anchor||"middle");t.setAttribute("font-family","Virgil, sans-serif");t.textContent=s;svg.appendChild(t);return t;}
function rect(x,y,w,h,stroke,sw){svg.appendChild(rc.rectangle(x,y,w,h,{stroke,strokeWidth:sw||2.4,roughness:1.4,bowing:1.1}));}
function arrow(x1,y1,x2,y2,color,sw){color=color||ORANGE;sw=sw||2.4;
  svg.appendChild(rc.line(x1,y1,x2,y2,{stroke:color,strokeWidth:sw,roughness:1.5}));
  const ang=Math.atan2(y2-y1,x2-x1),L=15,a=0.5;
  svg.appendChild(rc.line(x2,y2,x2-L*Math.cos(ang-a),y2-L*Math.sin(ang-a),{stroke:color,strokeWidth:sw,roughness:1}));
  svg.appendChild(rc.line(x2,y2,x2-L*Math.cos(ang+a),y2-L*Math.sin(ang+a),{stroke:color,strokeWidth:sw,roughness:1}));}

// Title
txt(W/2,52,"Same job. Every meeting. Zero effort.",30,LIGHT);

// --- Left box: Meeting notes ---
rect(60,100,200,80,LIGHT,2.4);
txt(160,136,"Meeting notes",22,LIGHT);
txt(160,160,"(Notion AI)",17,FAINT);

// Arrow: Meeting notes -> Agent
arrow(262,140,370,200,ORANGE);

// --- Centre box: Agent ---
rect(370,170,160,80,ORANGE,2.8);
txt(450,206,"Agent",26,ORANGE);
txt(450,230,"orchestrator",17,FAINT);

// --- Three output boxes on the right ---
const outputs=[
  ["Find follow-ups",LIGHT,100],
  ["Create + assign tickets",LIGHT,260],
  ["Draft follow-up email",LIGHT,420],
];
outputs.forEach(([label,color,cy])=>{
  rect(620,cy,220,70,color,2.2);
  txt(730,cy+42,label,20,color);
  // arrow from right edge of agent to left edge of output box
  // Agent right edge x=530, centre y=210
  // output left edge x=620, centre y = cy+35
  arrow(530,210,618,cy+35,ORANGE,2.0);
});

// --- Loop-back arrow: from bottom of output column back to Meeting notes ---
// Draw a path: from x=840, y=455 (bottom of last output) -> down to y=530 -> left to x=160 -> up to y=182 (bottom of Meeting notes box)
// Use rough lines to approximate the curve
svg.appendChild(rc.line(840,460,840,530,{stroke:FAINT,strokeWidth:2.2,roughness:1.3}));
svg.appendChild(rc.line(840,530,160,530,{stroke:FAINT,strokeWidth:2.2,roughness:1.3}));
// arrowhead going up
svg.appendChild(rc.line(160,530,160,184,{stroke:FAINT,strokeWidth:2.2,roughness:1.3}));
const ang2=Math.atan2(184-530,0),L2=15,a2=0.5;
svg.appendChild(rc.line(160,184,160-L2*Math.cos(ang2-a2),184-L2*Math.sin(ang2-a2),{stroke:FAINT,strokeWidth:2.2,roughness:1}));
svg.appendChild(rc.line(160,184,160-L2*Math.cos(ang2+a2),184-L2*Math.sin(ang2+a2),{stroke:FAINT,strokeWidth:2.2,roughness:1}));
txt(500,558,"Next meeting: same instructions, new notes.",18,FAINT);

window.__ready=true;
</script></body></html>
