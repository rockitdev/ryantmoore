<!DOCTYPE html><html><head><meta charset="utf-8">
<style>@font-face{font-family:'Virgil';src:url(https://excalidraw.com/Virgil.woff2) format('woff2');font-display:block;}
html,body{margin:0;padding:0;} svg text{font-family:'Virgil',sans-serif;}</style></head><body>
<svg id="scene" xmlns="http://www.w3.org/2000/svg" width="1140" height="800" viewBox="0 0 1140 800"></svg>
<script type="module">
import rough from "https://esm.sh/roughjs@4.6.6";
const svg=document.getElementById("scene"),NS="http://www.w3.org/2000/svg";
const LIGHT="#f4f2ec",ORANGE="#F54D26",FAINT="#a5a29a";
const bg=document.createElementNS(NS,"rect");bg.setAttribute("width",1140);bg.setAttribute("height",800);bg.setAttribute("fill","#0c0c10");svg.appendChild(bg);
const rc=rough.svg(svg);
function txt(x,y,s,size,c,a){const t=document.createElementNS(NS,"text");t.setAttribute("x",x);t.setAttribute("y",y);t.setAttribute("font-size",Math.max(size,20));t.setAttribute("fill",c);t.setAttribute("text-anchor",a||"middle");t.setAttribute("font-family","Virgil, sans-serif");t.textContent=s;svg.appendChild(t);}
function circ(x,y,d,c,sw){svg.appendChild(rc.circle(x,y,d,{stroke:c,strokeWidth:sw||3,roughness:1.3}));}
function ln(x1,y1,x2,y2,c,sw){svg.appendChild(rc.line(x1,y1,x2,y2,{stroke:c,strokeWidth:sw||3,roughness:1.3}));}
function rct(x,y,w,h,c,sw){svg.appendChild(rc.rectangle(x,y,w,h,{stroke:c,strokeWidth:sw||2.6,roughness:1.4,bowing:1.1}));}
function person(cx,hy,c){ circ(cx,hy,58,c); ln(cx,hy+29,cx,hy+120,c);
 ln(cx,hy+120,cx-30,hy+192,c); ln(cx,hy+120,cx+30,hy+192,c);         // legs
 ln(cx,hy+50,cx-44,hy+8,c); ln(cx,hy+50,cx+44,hy+8,c); }             // hands-behind-head (relaxed)
function robot(cx,hy,c){ rct(cx-36,hy-34,72,64,c); ln(cx,hy-34,cx,hy-54,c); circ(cx,hy-58,12,c);
 circ(cx-15,hy-6,12,c); circ(cx+15,hy-6,12,c); ln(cx-14,hy+16,cx+14,hy+16,c);
 rct(cx-42,hy+36,84,74,c); ln(cx-42,hy+70,cx-64,hy+92,c); ln(cx+42,hy+70,cx+64,hy+92,c); }  // body+arms
function meter(cx,cy,c){ rct(cx-84,cy-70,168,104,c,3);                 // display
 txt(cx,cy-24,"$ $ $",34,ORANGE); ln(cx-40,cy+8,cx+40,cy+8,ORANGE,2);
 ln(cx+48,cy+2,cx+48,cy-40,ORANGE,3); ln(cx+40,cy-32,cx+56,cy-30,ORANGE,3); // up-arrow
 rct(cx-14,cy+34,28,84,c); rct(cx-48,cy+118,96,20,c); }               // pole + base
txt(570,80,"Zero employees. One worker on a meter.",30,LIGHT);
person(190,320,LIGHT);      txt(190,590,"You",24,LIGHT);           txt(190,626,"no employees",18,FAINT);
robot(540,320,LIGHT);       txt(540,590,"your only worker",22,LIGHT); txt(540,626,"rented by usage",18,FAINT);
meter(910,330,LIGHT);       txt(910,600,"the bill",24,ORANGE);      txt(910,636,"seven figures a month",18,FAINT);
// subtle connectors (not arrows-as-flow, just gaze/link)
ln(250,300,470,300,FAINT,2); ln(610,300,800,300,FAINT,2);
txt(570,720,"No payroll. You rent the worker by usage, and the meter is most of the story.",21,FAINT);
window.__ready=true;
</script></body></html>
