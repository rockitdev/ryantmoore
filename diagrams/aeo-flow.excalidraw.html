<!DOCTYPE html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Virgil';src:url(https://excalidraw.com/Virgil.woff2) format('woff2');font-display:block;}
html,body{margin:0;padding:0;}
svg text{font-family:'Virgil',sans-serif;}
</style></head>
<body>
<svg id="scene" xmlns="http://www.w3.org/2000/svg" width="900" height="1040" viewBox="0 0 900 1040"></svg>
<script type="module">
import rough from "https://esm.sh/roughjs@4.6.6";
const svg=document.getElementById("scene");
const NS="http://www.w3.org/2000/svg";
const LIGHT="#f4f2ec", ORANGE="#F54D26", FAINT="#a5a29a";
const bg=document.createElementNS(NS,"rect");
bg.setAttribute("width",900);bg.setAttribute("height",1040);bg.setAttribute("fill","#0c0c10");svg.appendChild(bg);
const rc=rough.svg(svg);
function txt(x,y,s,size,color,anchor="middle"){
  const t=document.createElementNS(NS,"text");
  t.setAttribute("x",x);t.setAttribute("y",y);t.setAttribute("font-size",size);
  t.setAttribute("fill",color);t.setAttribute("text-anchor",anchor);t.textContent=s;svg.appendChild(t);
}
function rect(x,y,w,h,stroke){svg.appendChild(rc.rectangle(x,y,w,h,{stroke,strokeWidth:2.4,roughness:1.4,bowing:1.1}));}
function arrowDown(cx,y1,y2){
  svg.appendChild(rc.line(cx,y1,cx,y2,{stroke:ORANGE,strokeWidth:2.4,roughness:1.5}));
  svg.appendChild(rc.line(cx,y2,cx-8,y2-12,{stroke:ORANGE,strokeWidth:2.4,roughness:1}));
  svg.appendChild(rc.line(cx,y2,cx+8,y2-12,{stroke:ORANGE,strokeWidth:2.4,roughness:1}));
}
const CX=450, BW=660, BX=CX-BW/2;
txt(CX,74,"What helps you become the AI answer",36,LIGHT);
// steps: {title, sub, col, h}
const steps=[
  {t:"Someone asks an AI", sub:null, col:LIGHT, h:82},
  {t:"Can it FIND you?", sub:"crawlable · indexed · listed", col:ORANGE, h:118},
  {t:"Can it UNDERSTAND you?", sub:"what you do · where you serve · plainly", col:ORANGE, h:118},
  {t:"Can it VERIFY you?", sub:"consistent · reviewed · mentioned", col:ORANGE, h:118},
  {t:"You can be the answer", sub:null, col:LIGHT, h:82},
];
let y=132;
steps.forEach((s,i)=>{
  rect(BX,y,BW,s.h,s.col);
  if(s.sub){ txt(CX,y+s.h/2-8,s.t,28,s.col); txt(CX,y+s.h/2+26,s.sub,21,FAINT); }
  else { txt(CX,y+s.h/2+9,s.t,29,s.col); }
  if(i<steps.length-1){ arrowDown(CX,y+s.h+12,y+s.h+50); y=y+s.h+62; }
});
txt(CX,985,"Same groundwork. New front door.",23,LIGHT);
txt(CX,1020,"ryantmoore.ca",18,FAINT);
window.__ready=true;
</script></body></html>
