services:
  preview:
    image: node:22-alpine
    working_dir: /app
    volumes: [".:/app", "node_modules:/app/node_modules"]
    command: sh -c "npm install && npm run dev -- --host"
    ports: ["127.0.0.1:4333:4321", "192.168.1.38:4333:4321"]
    restart: unless-stopped
volumes: { node_modules: {} }
